# -*- coding: utf-8 -*-
#
# privacyIDEA 추가 설정 (컨테이너 내부 /etc/privacyidea/pi.cfg)
#
# 비밀값(DB 비밀번호, PEPPER, SECRET_KEY, 암호화 키, 감사로그 서명키)은
# 이 파일에 두지 않는다. DockerConfig 가 /run/secrets/* 와 *_FILE
# 환경변수에서 읽어 온다. 여기에는 보안 기본값만 둔다.
#
import os

_env = os.environ.get

# 로그 레벨 (DEBUG 는 요청 파라미터가 기록될 수 있으니 운영에서 사용 금지)
PI_LOGLEVEL = _env("PI_LOGLEVEL", "INFO").upper()

# 노드 식별자: 읽기 전용 파일시스템에서 uuid 파일을 쓰지 않도록 고정
PI_NODE = _env("PI_NODE_NAME", "pi-docker")
PI_AUDIT_SERVERNAME = PI_NODE
if _env("PI_NODE_UUID"):
    PI_NODE_UUID = _env("PI_NODE_UUID")

# 외부에서 보이는 URL (메일 링크, QR 코드 등에 사용)
if _env("PI_BASE_URL"):
    PI_BASE_URL = _env("PI_BASE_URL")

# 감사 로그: 긴 값은 잘라서 저장하여 DB 오류로 인증이 실패하지 않도록 함
PI_AUDIT_SQL_TRUNCATE = True

# 로컬 DB 관리자만 관리자 권한을 갖는다 (사용자 realm 을 superuser 로 쓰지 않음)
SUPERUSER_REALM = [r for r in _env("PI_SUPERUSER_REALM", "").split(",") if r]

# 조건부 접근(잠금/차단) 엔진이 절대 차단하지 않을 주소
# (Nginx/RADIUS 컨테이너 대역, 방화벽 관리 IP 등) - 자기 자신에 대한 DoS 방지
PI_CONDITIONAL_ACCESS_NEVER_BLOCK = _env("PI_NEVER_BLOCK", "")

# DB 커넥션 풀
SQLALCHEMY_ENGINE_OPTIONS = {
    "pool_size": int(_env("PI_DB_POOL_SIZE", "10")),
    "max_overflow": 10,
    "pool_recycle": 1800,
    "pool_pre_ping": True,
}

# 번역 경고 비활성화, 기본 언어
PI_TRANSLATION_WARNING = False
PI_PREFERRED_LANGUAGE = ["ko", "en", "de"]
