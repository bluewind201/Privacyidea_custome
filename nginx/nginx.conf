# Nginx 리버스 프록시 - 비루트(uid 101), 읽기 전용 루트 파일시스템에서 동작
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # 쿼리스트링($request_uri)은 비밀번호가 포함될 수 있어 기록하지 않고 $uri 만 남긴다
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   30s;
    client_max_body_size        1m;
    client_body_timeout         15s;
    client_header_timeout       15s;
    send_timeout                30s;
    large_client_header_buffers 4 8k;

    # ---- 요청 속도 제한 (IP 기준) ----
    # 로그인(POST /auth): 무차별 대입 방지
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key     zone=pi_auth:10m     rate=10r/m;
    # /validate: RADIUS 서버 한 대에서 모든 VPN 요청이 오므로 넉넉하게
    limit_req_zone $binary_remote_addr zone=pi_validate:10m rate=50r/s;
    # 그 외 API/WebUI
    limit_req_zone $binary_remote_addr zone=pi_general:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=pi_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # GET /validate/* 는 비밀번호가 URL(로그)에 남으므로 차단 (POST 만 허용)
    map $request_method $validate_bad_method {
        POST    0;
        default 1;
    }

    upstream privacyidea {
        server privacyidea:8080;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
